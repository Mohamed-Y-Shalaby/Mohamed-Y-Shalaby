<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof. Mohamed Y. Shalaby | Electronics & Communications Engineering</title>
  <meta name="description" content="Academic portfolio of Prof. Mohamed Y. Shalaby - Associate Professor specializing in Nonlinear Optics, Optical Communications, and Photonic Systems">
  
  <!-- Academic Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="css/styles.css?v=2.1">
  
  <!-- Inline Fallback Styles -->
  <style>
    :root {
      --primary: #1a365d;
      --secondary: #2c5282;
      --accent: #3182ce;
      --light: #f7fafc;
      --dark: #1a202c;
      --gray: #4a5568;
      --border: #e2e8f0;
    }
    
    .dynamic-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      overflow: hidden;
    }
    
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
    }
    
    .main-navigation {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 20px 0;
      border-bottom: 3px solid var(--primary);
    }
    
    .nav-tab {
      padding: 12px 20px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--gray);
    }
    
    .nav-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Dynamic Background -->
  <div class="dynamic-background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Header / Hero Section -->
    <header>
      <div class="hero">
        <!-- Content will be dynamically loaded by JavaScript -->
      </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="main-navigation no-print">
      <button class="nav-tab active" data-section="all"><i class="fas fa-th"></i> All Sections</button>
      <button class="nav-tab" data-section="summary"><i class="fas fa-user"></i> Summary</button>
      <button class="nav-tab" data-section="research"><i class="fas fa-lightbulb"></i> Research</button>
      <button class="nav-tab" data-section="education"><i class="fas fa-graduation-cap"></i> Education</button>
      <button class="nav-tab" data-section="experience"><i class="fas fa-briefcase"></i> Experience</button>
      <button class="nav-tab" data-section="publications"><i class="fas fa-book"></i> Publications</button>
      <button class="nav-tab" data-section="patents"><i class="fas fa-certificate"></i> Patents</button>
      <button class="nav-tab" data-section="projects"><i class="fas fa-flask"></i> Projects</button>
      <button class="nav-tab" data-section="service"><i class="fas fa-hands-helping"></i> Service</button>
      <button class="nav-tab" data-section="skills"><i class="fas fa-tools"></i> Skills</button>
    </nav>

  <!-- Professional Summary -->
  <section id="summary">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Research Interests -->
  <section id="research">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Education -->
  <section id="education">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Professional Experience -->
  <section id="experience">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Selected Publications -->
  <section id="publications">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Patents -->
  <section id="patents">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Research Projects & Funding -->
  <section id="projects">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Professional Service -->
  <section id="service">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Skills & Languages -->
  <section id="skills">
    <!-- Content will be dynamically loaded -->
  </section>

  <!-- Footer -->
  <footer>
    <!-- Content will be dynamically loaded -->
  </footer>

  </div>
  <!-- End Main Container -->

  <!-- External JavaScript Files -->
  <script src="data/content.js?v=2.1"></script>
  <script src="js/main.js?v=2.1"></script>

</body>
</html>
